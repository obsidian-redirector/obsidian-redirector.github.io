<!DOCTYPE html>
<html>
<head>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🪨</text></svg>">
  <meta charset="utf-8">
  <title></title>
  <style>
    body { font-family: sans-serif; max-width: 600px; margin: 60px auto; padding: 0 20px; color: #333; }
    a { color: #7c3aed; }
  </style>
</head>
<body>
  <div id="info"></div>
  <script>
    const target = "obsidian://open" + location.search

    const obsidianParams = new URLSearchParams(location.search)
    const vault = obsidianParams.get('vault') || '?'
    const file = obsidianParams.get('file') || '?'

    document.title = vault + ':' + file

    document.getElementById('info').innerHTML =
      '<p>Opening file <strong>' + file + '</strong> in vault <strong>' + vault + '</strong>...</p>' +
      '<p><a href="' + target + '">Click here if Obsidian did not open</a></p>'

    window.location.href = target
  </script>
</body>
</html>
